      - video_id: JcxWiBFNmm8
        title: "[3] Drowning in Dunya"
        url: https://www.youtube.com/watch?v=JcxWiBFNmm8
        description: Verses 3-5 of Surah Fatir talks about remembering Allah's mercy and avoiding the traps of this world.
      - video_id: AL2KYPqnMuA
        title: "[4] Satan's Despair"
        url: https://www.youtube.com/watch?v=AL2KYPqnMuA
        description: Verses 6-7 of Surah Fatir describes why Satan opposes Allah, despite firmly believing in Him.
      - video_id: EsiYWsTtUhs
        title: "[5] Telling Right from Wrong"
        url: https://www.youtube.com/watch?v=EsiYWsTtUhs
        description: Verses 8-10 of Surah Fatir describes how our default nature gives us a rudimentary ability to distinguish right from wrong. But we need revelation to develop a more advanced views.
      - video_id: BIiFFH5kZrg
        title: "[6] The Preserved Tablet"
        url: https://www.youtube.com/watch?v=BIiFFH5kZrg
        description: Verses 11-13 of Surah Fatir talks about unseen information that Allah granted to the imams, and the difference in effects when an action is performed by a believer or a rejecter.
      - video_id: FHJGw50OuAU
        title: "[7] The Powerless Gods"
        url: https://www.youtube.com/watch?v=FHJGw50OuAU
        description: Verses 14-18 of Surah Fatir reminds us of how helpless we are on God for every aspect of our existence.
      - video_id: YjttDevB0nc
        title: "[8] The Spiritual Senses"
        url: https://www.youtube.com/watch?v=YjttDevB0nc
        description: Verses 19-24 of Surah Fatir describe the effects of being blind to the truth, the darkness you then stumble around in, and the effect it will have on you
      - video_id: l-o_hGl51sI
        title: "[9] Belief without Action"
        url: https://www.youtube.com/watch?v=l-o_hGl51sI
        description: Verses 25-30 of Surah Fatir describes how true kufr is knowing the truth but not acting on it.
      - video_id: AN2eZXR-i3I
        title: "[10] The Quran's Inheritors"
        url: https://www.youtube.com/watch?v=AN2eZXR-i3I
        description: Verses 31-35 of Surah Fatir describes the intellectual inheritors of the Quran, and the three types of servants of Allah.
      - video_id: FopxBU8Rbe0
        title: "[11] Last Minute Regrets"
        url: https://www.youtube.com/watch?v=FopxBU8Rbe0
        description: Verses 36-38 of Surah Fatir describes the feeling of the criminals in the next world.
      - video_id: 47gNW0fPzs0
        title: "[12] Faith without Evidence"
        url: https://www.youtube.com/watch?v=47gNW0fPzs0
        description: Verses 39-41 of Surah Fatir describes how Islam rebukes the notion of believing in something without having evidence to back it up, how kufr is really self-harm, and the types of of caliphs.
      - video_id: z_jk_u8jGGE
        title: "[13] Dangers of Takabbur"
        url: https://www.youtube.com/watch?v=z_jk_u8jGGE
        description: Verses 42-45 of Surah Fatir describes how arrogance can make people dislike the truth, which is why takkabur is so dangerous.
