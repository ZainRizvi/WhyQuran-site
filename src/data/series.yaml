        url: https://www.youtube.com/watch?v=ugo_PW1ayYw
        description: Verse 68-72 talk about various lessons of history that the Quran showed were happening again during the time of the Prophet.  Those same events keep repeating even up to the present day.
      - video_id: lqLK38jzgqI
