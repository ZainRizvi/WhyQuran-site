  - id: surah-al-anbiya
    title: Surah Al-Anbiya
    surah_number: 21
    description: Tafsir of Surah Al-Anbiya (The Prophets), narrating stories of various prophets including Abraham, Moses, David, Solomon, and Jesus, emphasizing the unity of their divine message.
    speaker: Sheikh Azhar Nasser
    playlist_id: PLpkB0iwLgfTYRUaUPy_LJlpZvQwRAEwqi
    playlist_url: https://www.youtube.com/playlist?list=PLpkB0iwLgfTYRUaUPy_LJlpZvQwRAEwqi
    thumbnail_video_id: eB40wymVBMk
    episodes:
      - video_id: eB40wymVBMk
        title: "[1a] Background and Context"
        url: https://www.youtube.com/watch?v=eB40wymVBMk
        description: Sheikh Azhar Nasser introduces us to the background of Surah Al-Anbiya, the context in which it was revealed, and provides and overview of the surah.
      - video_id: y9Er2LpOEvI
        title: "[1b] Auditing Your Life"
        url: https://www.youtube.com/watch?v=y9Er2LpOEvI
        description: Verse 1 of Surah Al-Anbiya reminds about the day of judgement and how we will be taken to account for our actions
      - video_id: HbBJKuqM3Mg
        title: "[2] Neglecting God's Reminders"
        url: https://www.youtube.com/watch?v=HbBJKuqM3Mg
        description: Verses 2-4 of Surah Al-Anbiya describe the effects on people when they don't heed the reminders God sends them, and rather mock them instead.  Even Muslims should wonder if they behave in any of these ways.
      - video_id: heFMWRp26oc
        title: "[3] Relatable Teachers"
        url: https://www.youtube.com/watch?v=heFMWRp26oc
        description: Verses 5-8 of Surah Al-Anbiya describe the need for us to have role models who we find relatable.  This was why Allah sent us prophets who were normal human beings, and they were usually born to the same tribes who they were meant to lead.
      - video_id: 3zV7NbHuegA
        title: "[4] Results of Oppression"
        url: https://www.youtube.com/watch?v=3zV7NbHuegA
        description: Verses 9-15 of Surah Al-Anbiya describe the effects the actions of the worst oppressors have.
      - video_id: ADm36OANdo4
        title: "[5] Why Were We Created?"
        url: https://www.youtube.com/watch?v=ADm36OANdo4
      - video_id: 4UJpmIubbaQ
        title: "[6] The Meanings of 'God' ('Ilah')"
        url: https://www.youtube.com/watch?v=4UJpmIubbaQ
        description: Verses 21-24 of Surah Al-Anbiya cover Tawhid and describe what the world would look like if other gods also existed and disprove that idea.  Sheikh Azhar also goes into various aspects of Arabic grammer relevant to these verses.
      - video_id: aYB_nX1DOGM
        title: "[7] The Intercessors"
        url: https://www.youtube.com/watch?v=aYB_nX1DOGM
        description: Verses 25-29 of Surah Al-Anbiya emphasize various aspects of tawheed and bring up the concept of intercession.  Key ideas are that real belief in Allah drives one to action, and the attributes of those who are able to interceed on behalf of people on the Day of Judgement.
      - video_id: 0IpcOnDIPv0
        title: "[8a] Science in the Quran"
        url: https://www.youtube.com/watch?v=0IpcOnDIPv0
        description: Verses 30-33 of Surah Al-Anbiya how various aspects of our universe, like the mountains and the atmosphere, are blessings from Allah without which our survival would not be possible. It references natural phenomenon which have only been discovered by science recently.
      - video_id: 7XExn4QwWHk
        title: "[8b] You're Tested with Wealth"
        url: https://www.youtube.com/watch?v=7XExn4QwWHk
        description: Verses 34-35 of Surah Al-Anbiya describes how both having and not having material blessings in this world is a test for people, and it establishes the inevitiability of death
      - video_id: fOsLXCR_fks
        title: "[9] The Darkness of the Soul"
        url: https://www.youtube.com/watch?v=fOsLXCR_fks
        description: Verses 36-40 of Surah Al-Anbiya covers the mercy of the prophet, the dismissive rejection by the kuffar, and the effects their rejection has on the rejector's souls
      - video_id: 9WNeEMIPqPE
        title: "[10] Pondering God"
        url: https://www.youtube.com/watch?v=9WNeEMIPqPE
        description: Verses 41-45 of Surah Al-Anbiya the importance of thinking about God and the Prophet's response to those who mocked him
      - video_id: TzmJ5at1PC4
        title: "[11] Weighing Your Deeds"
        url: https://www.youtube.com/watch?v=TzmJ5at1PC4
        description: Verses 46-49 of Surah Al-Anbiya the various stages of heaven, and the people of hell realizing that hell is the reality of their own souls instead of a punishment forced upon them.
      - video_id: GK_RzUjhLW0
        title: "[12] Prophet Abraham"
        url: https://www.youtube.com/watch?v=GK_RzUjhLW0
        description: Verses 50-58 of Surah Al-Anbiya the story of Prophet Abraham and how he tried to show his people the truth
      - video_id: NNaCd_xNwPM
        title: "[13] Abraham Thrown into the Fire"
        url: https://www.youtube.com/watch?v=NNaCd_xNwPM
        description: Verses 59-70 of Surah Al-Anbiya show how Prophet Abraham worked to expose the false idols his peoplep worshipped, and how God protected him from their wrath
      - video_id: SVOMYLK0n4o
        title: "[14] Abraham's Legacy"
        url: https://www.youtube.com/watch?v=SVOMYLK0n4o
        description: Verses 71-73 of Surah Al-Anbiya describes what happened after the fire failed to burn Prophet Abraham, and the legacy of his descendants.
      - video_id: NuBHij9COBY
        title: "[15] Prophets Lut and Noah"
        url: https://www.youtube.com/watch?v=NuBHij9COBY
        description: Verses 74-77 of Surah Al-Anbiya describes the stories of Prophet Lut (Lot) and Nuh (Noah). It covers the struggles the depth of evil their communities had sunk to and their eventual removal to protect the rest of humanity from their influence.
      - video_id: wbmsUVu8k9A
        title: "[16] Prophets David and Solomon"
        url: https://www.youtube.com/watch?v=wbmsUVu8k9A
        description: Verses 78-82 of Surah Al-Anbiya describes the stories of Prophet Dawood (David) and Suleiman (Solomon). They are examples of prophets who ruled mighty kingdoms with Allah's support and contains examples of their wisdom.
      - video_id: 4t2GZ1F0_pg
        title: "[17] A Burden too Large to Bear?"
        url: https://www.youtube.com/watch?v=4t2GZ1F0_pg
        description: Verses 83-88 of Surah Al-Anbiya describes the stories of Prophet Ayub (Job) and Prophet Yunus (Jonas). They are examples of prophets who faced extreme hardship and turned to Allah for support.
      - video_id: R2PhQc4LnY8
        title: "[18] Zakariya's Duas"
        url: https://www.youtube.com/watch?v=R2PhQc4LnY8
        description: Verses 89-90 of Surah Al-Anbiya describes the story of Prophet Zakariya and Lady Maryam. He describes the beauty of dua and the real essence which we should be striving for in our prayers
      - video_id: iaXXM4qZLlg
        title: "[19a] Virgin Mary's Status"
        url: https://www.youtube.com/watch?v=iaXXM4qZLlg
        description: Verse 91 of Surah Al-Anbiya elaborates on the status of the Virgin Mary (Bibi Maryam).  Sheikh Azhar discusses the Spirit blown into her and how the Quran is establishing her spiritual rank to be equivalent to that of the other prophets mentioned in these verses.
      - video_id: Qvz7sEB7094
        title: "[19b] Dividing into Sects"
        url: https://www.youtube.com/watch?v=Qvz7sEB7094
        description: Verses 92-94 of Surah Al-Anbiya describes communities of the past breaking into sects and shares advice on how we should be treating each other, with an emphasis on what Shia/Sunni etiquette should be
      - video_id: JcSBnHX9i2I
        title: "[19c] Question & Answer Session"
        url: https://www.youtube.com/watch?v=JcSBnHX9i2I
        description: "Question Sheikh Azhar answers in the Q&A include:"
      - video_id: kEHNYHgs9eg
        title: "[20] Yahjooj & Mahjooj"
        url: https://www.youtube.com/watch?v=kEHNYHgs9eg
        description: Verses 95-100 of Surah Al-Anbiya gives the background of Yahjooj and Mahjooj (Gog and Magog) and various interpretations of their return.  Sheikh Azhar then describes the reality of the fire of hell and what causes the flames to burn.
      - video_id: KieYKwhzIUY
        title: "[21] Imam Mehdi's Companions"
        url: https://www.youtube.com/watch?v=KieYKwhzIUY
        description: Verses 95-100 of Surah Al-Anbiya goes into depth about what heaven really is, the process of the universe being destroyed and recreated before the day of judgement, and the ashaab of Imam Mehdi
      - video_id: 9C6qR_Ltg_o
        title: "[22] Inner Peace Through Tawhid"
        url: https://www.youtube.com/watch?v=9C6qR_Ltg_o
        description: Verses 106-112 of Surah Al-Anbiya talk about the importance of tawhid and how correctly following it leads to inner peace
  - id: surah-ar-rum
    title: Surah Ar-Rum
    surah_number: 30
    description: Tafsir of Surah Ar-Rum (The Romans), exploring prophecies about the Roman Empire, signs of Allah in creation, and guidance for spiritual purification.
    speaker: Sheikh Azhar Nasser
    playlist_id: PLpkB0iwLgfTaJQIx2eZ-bBcvBPTihydkh
    playlist_url: https://www.youtube.com/playlist?list=PLpkB0iwLgfTaJQIx2eZ-bBcvBPTihydkh
    thumbnail_video_id: OLE5Qx_4ZUc
    episodes:
      - video_id: OLE5Qx_4ZUc
        title: "[01] Predicting Roman Conquest"
        url: https://www.youtube.com/watch?v=OLE5Qx_4ZUc
        description: Verses 1-6 of Surah Ar-Rum describes a miraculous prediction made by the Quran about the success of the Roman empire when it had just taken a staggering blow from the Persians
      - video_id: fYQofPq0h2k
        title: "[02] Introspection"
        url: https://www.youtube.com/watch?v=fYQofPq0h2k
        description: Verses 7-10 of Surah Ar-Rum talk about the importance of introspection and pondering over our reality. He ties it in to the lessons we should learn from the current Corona virus pandemic
      - video_id: 3XrR9mwLHkg
        title: "[03] Transactions on Qiyamat"
        url: https://www.youtube.com/watch?v=3XrR9mwLHkg
        description: Verses 11-15 of Surah Ar-Rum discuss the nature of the resurrection and why people would despair on the Day of Judgement even when they're in the presence of the Most Merciful.
      - video_id: jd-UEbY0gQI
        title: "[04] Why Five Prayers?"
        url: https://www.youtube.com/watch?v=jd-UEbY0gQI
        description: Verses 16-21 of Surah Ar-Rum discuss various signs of Allah and our remembrance of him.  They describe the times in which He should be remembered, and Sheikh Azhar shares a hadith about why we have five wajib prayers.
      - video_id: SK_i6h01dtk
        title: "[05] Soul Departing During Sleep"
        url: https://www.youtube.com/watch?v=SK_i6h01dtk
        description: Verses 22-25 of Surah Ar-Rum discuss signs of Allah from the visible world, talking about the creation of the universe, our human bodies, and rain and lightening.
      - video_id: m6gu6LYCZKU
        title: "[06] Subduing your Nafs"
        url: https://www.youtube.com/watch?v=m6gu6LYCZKU
        description: Verses 26-29 of Surah Ar-Rum talks about those who follow their base desires blindly. Sheikh Azhar Nasser goes on to describe techniques taught by the Imams for how to train one's self to better resist temptation
      - video_id: at5gLJ4XTjU
        title: "[07] The Subtle Shirks"
        url: https://www.youtube.com/watch?v=at5gLJ4XTjU
        description: Verses 30-36 of Surah Ar-Rum talks about the types of Shirk that even believers are at risk of sucumbing to. These include looking to other entities for success, showing off, and valueing anything over Islam
      - video_id: ZG3I0VZpxX0
        title: "[08] Your Rizq"
        url: https://www.youtube.com/watch?v=ZG3I0VZpxX0
        description: Verses 37-39 of Surah Ar-Rum talk about the sustenance Allah provides, giving charity, and the proper mindset when giving it
      - video_id: NzU74ReCqz0
        title: "[09] Effects of Corruption"
        url: https://www.youtube.com/watch?v=NzU74ReCqz0
        description: Verses 40-43 of Surah Ar-Rum talk about fasada and it's consequenses, and how sins affect us and the world around us
      - video_id: 54B2ibMw4gE
        title: "[10] Hidden Truths about Wind"
        url: https://www.youtube.com/watch?v=54B2ibMw4gE
        description: Verses 44-46 of Surah Ar-Rum talk about how wind is described as both a blessing and a punishment in the Qurah, and the different context in which the two forms are applied
      - video_id: 8XEU1BD4I7w
        title: "[11] The Blind, Deaf and Dead"
        url: https://www.youtube.com/watch?v=8XEU1BD4I7w
        description: Verses 47-53 of Surah Ar-Rum talk about the spiritual blindness and deaths one may have, and the effects of gaining or loosing Allah's blessings
      - video_id: J870k6aqe5c
        title: "[12] Time in Barzakh"
        url: https://www.youtube.com/watch?v=J870k6aqe5c
        description: Verses 54-60 of Surah Ar-Rum talk about the passage of time in barzakh, iman vs knowledge, and the virtue of patience
