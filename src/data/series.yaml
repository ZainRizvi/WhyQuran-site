  - id: surah-an-am
    title: Surah An'am
    surah_number: 6
    description: "Tafsir of Surah An'am (Surah #6)"
    playlist_id: PLpkB0iwLgfTYkIWHLiRcRaSnXnwfjFQhC
    playlist_url: https://www.youtube.com/playlist?list=PLpkB0iwLgfTYkIWHLiRcRaSnXnwfjFQhC
    thumbnail_video_id: xnUADMhsAlM
    episodes:
      - video_id: xnUADMhsAlM
        title: Surah An'aam Tafsir | Part 1 | Quran | Sheikh Azhar Nasser [English]
        url: https://www.youtube.com/watch?v=xnUADMhsAlM
        description: To learn the most from a surah you need to know it's background and the context in which it was revealed. Who was the audience? There are Meccan surahs and Medina Surahs, Surah An'aam is a late Meccan surah. It was revealed in the final year that the prophet was in Mecca (13th year).
      - video_id: yfkqeMQluAI
        title: Surah An'aam Tafsir | Part 2 | Quran | Sheikh Azhar Nasser [English]
        url: https://www.youtube.com/watch?v=yfkqeMQluAI
        description: Covers Verses 2-5 of Surah An'aam, discussing the creation of man, God's omnipotence, reminders about how people would reject God's message even during the time of the earlier prophets, and the various stages of the rejection of truth
      - video_id: jfv2IVylMEI
        title: Surah An'aam Tafsir | Part 3 | Quran | Sheikh Azhar Nasser [English]
        url: https://www.youtube.com/watch?v=jfv2IVylMEI
        description: Covers Verses 6-10 of Surah An'aam. This discusses the past generations that were destroyed for their sins, and the extent to which disbelievers will refuse to believe the truth, regardless of whether or not the miracles are sent to accompany the messenger
      - video_id: 9Kci7fK6T0A
        title: Surah An'aam Tafsir | Part 4 | Quran | Sheikh Azhar Nasser [English]
        url: https://www.youtube.com/watch?v=9Kci7fK6T0A
        description: "Verse 11: Say, ‘Travel over the land, and then observe how was the fate of the deniers.’"
      - video_id: 59IRIcd6eLo
        title: Surah An'aam Tafsir | Part 5 | Quran | Sheikh Azhar Nasser [English]
        url: https://www.youtube.com/watch?v=59IRIcd6eLo
        description: "Verse 14: Say, ‘Shall I take for guardian [anyone] other than Allah, the originator of the heavens and the earth, who feeds and is not fed?’ Say, ‘I have been commanded to be the first of those who submit [to Allah],’ and never be one of the polytheists."
      - video_id: S4Qx7pjyGOE
        title: Surah An'aam Tafsir | Part 6 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=S4Qx7pjyGOE
        description: |-
          Verse 19:
          Say [oh Mohammed]: "What thing is greatest as witness?" Say: "Allah! [He is] witness between me and you, and this Qur’an has been revealed to me that I may warn thereby you and whomever it may reach. Do you indeed bear witness that there are other gods besides Allah?" Say: "I do not bear witness [to any such thing]." Say: "Indeed He is the One God and I indeed disown what you associate [with Him]."
      - video_id: XJXde5e0d9o
        title: Surah An'aam Tafsir | Part 7 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=XJXde5e0d9o
        description: Covers Verses 21-24 of Surah An'aam. These verses discuss those who forge messages and claim they have been divinely sent. It continues to discuss the fate of the rejecters on the day of judgement, and how they would lie on that day to distance themselves from their beliefs while alive
      - video_id: TCxs4nBqOIs
        title: Surah An'aam Tafsir | Part 8 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=TCxs4nBqOIs
        description: Exegesis of the Holy Quran - by Sheikh Azhar Nasser. Covers Verses 25-28 of Surah An'aam. It discusses those who not only reject the truth but prevent others from accepting it as well, blind to the damage they are doing to themselves.  It describes how even if these people were to witness the day of judgement and were then sent back to this world, they would still revert to their previous actions
      - video_id: w12s90sLRPo
        title: Surah An'aam Tafsir | Part 9 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=w12s90sLRPo
        description: Exegesis of the Holy Quran - by Sheikh Azhar Nasser - Covers Verses 29-32 of Surah An'aam. These verses discuss how the rejecters deny life after death, and the punishment they will be facing in the next world because of their actions
      - video_id: PbfHbTzSvrw
        title: Surah An'aam Tafsir | Part 10 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=PbfHbTzSvrw
        description: |-
          *******************************
          Verse 33: "We certainly know that what they say grieves you. Yet it is not you that they deny, but it is Allah’s signs that the wrongdoers impugn"
          *******************************
      - video_id: 1LReYyC2dLw
        title: Surah An'aam Tafsir | Part 11 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=1LReYyC2dLw
        description: "Verse 35: And should their aversion be hard on you, find, if you can, a tunnel into the ground, or a ladder into sky, that you may bring them a sign. Had Allah wished, He would have brought them together on guidance. So do not be one of the ignorant."
      - video_id: D29vuRCosik
        title: Surah An'aam Tafsir | Part 12 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=D29vuRCosik
        description: "Verse 39: Those who deny Our signs are deaf and dumb, in darkness. Allah leads astray whomever He wishes, and whomever He wishes He puts him on a straight path."
      - video_id: o8RNJJzTHLc
        title: Surah An'aam Tafsir | Part 13 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=o8RNJJzTHLc
        description: "Verse 43: Why did they not entreat when Our punishment overtook them! But their hearts had hardened, and Satan had made to seem decorous to them what they had been doing."
      - video_id: EetHBnJAkLs
        title: Surah An'aam Tafsir | Part 14 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=EetHBnJAkLs
        description: "Verse 50: Say, ‘I do not say to you that I possess the treasuries of Allah, nor do I know the Unseen, nor do I say to you that I am an angel. I follow only what is revealed to me.’ Say, ‘Are the blind one and the seer equal?'  So do you not reflect’"
      - video_id: ESFtoBhDTj4
        title: Surah An'aam Tafsir | Part 15 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=ESFtoBhDTj4
        description: |-
          This lecture covers Verses 56 - 60 of Surah An'aam
          Topics include: Knowledge of the Unseen (ilm ul ghayb), Polythiesm, and the Psychological Pressure the prophet Muhammad was under.
      - video_id: vYFMkk6BTFo
        title: Surah An'aam Tafsir | Part 16 | Quran | Sheikh Azhar Nasser | English
        url: https://www.youtube.com/watch?v=vYFMkk6BTFo
