      - video_id: UrYM_Uv3YOU
        title: "[27] Getting Yathrib's Allegiance"
        url: https://www.youtube.com/watch?v=UrYM_Uv3YOU
        description: Medina (Yathrib) was in the middle of the civil war, when one of the factions was introduced to the Prophet Muhammad. The encounter left two men captivated, and gradually more and more people became enamored by the prophet's message. All in strict secrecy. By Sheikh Azhar Nasser
      - video_id: hYksT1Idx4A
        title: "[28] Hijra to Medina & the Assassination Attempt"
        url: https://www.youtube.com/watch?v=hYksT1Idx4A
        description: Medina (Yathrib) was ideally suited to be the new home to the Prophet's message.  This lecture describes what it was that made Medina a good location, the gradual emigration of Muslims to Medina along with the challenges they faced, the first of the two brotherhood pacts made by the muslims, and the plot to assissinate the prophet. By Sheikh Azhar Nasser
      - video_id: MWBwdei29qE
        title: "[29] Hirja: Abu Bakr, Ali, and Prophet Muhammad"
        url: https://www.youtube.com/watch?v=MWBwdei29qE
        description: "When Prophet Muhammad learned about the assassination plot against him, he choose his most trustworthy companion to be the decoy: Ali ibn Abi Talib. Why did Abu Bakr migrated with the Prophet? Sunni vs Shia views on the merits of the Quranic verse on Abu Bakr during this hijrat (Quran 9:40), and the first instance of enmity towards the prophet expressed by Abu Bakr. By Sheikh Azhar Nasser"
      - video_id: uWgHE4DaJ60
        title: "[30] Hijra: The First Masjid"
        url: https://www.youtube.com/watch?v=uWgHE4DaJ60
        description: Prophet Muhammad's arrival in Quba, the building of the Quba Masjid, and how Prophet Muhammad let Allah guide him through his camel to find a place to stay at in Medina, with the camel stopping  at Abu Ayyub al Ansari's home. Lecture by Sheikh Azhar Nasser
      - video_id: YO1Yfm3X-SY
        title: "[31] Building the Prophet's Mosque, Masjid al Haram"
        url: https://www.youtube.com/watch?v=YO1Yfm3X-SY
        description: After Prophet Muhammad settled in Abu Ayyub al-Ansari's home in Medina, he purchased the lot next to it and started building a masjid there. This became known as Al Masjid an-Nabawi (the Prophet's Mosque) and Masjid al-Haram (the Sacred Mosque). Azan was legislated soon after, and within half a year after hijra the Second Pact of Brotherhood was made between the Muhajireen and Ansaar.
      - video_id: GlsSgEO9vPM
        title: "[32] The Constitution of Medina"
        url: https://www.youtube.com/watch?v=GlsSgEO9vPM
        description: "The Prophet Muhammad had been invited to Medina to quell tensions in the city. With a few months of arriving, he created a social contract between the different tribes in they city, specifying the behaviors expected from each group: Ansar, Muhajireen, Jews, and Polythiests"
      - video_id: AmX5uGS4ihs
        title: "[33] The Caravan Raids"
        url: https://www.youtube.com/watch?v=AmX5uGS4ihs
        description: This lecture covers how the prophet changed Yathrib's name to Medina, the rise of hypocrisy in Medina as political expediency caused people to convert without having any Islamic conviction, the first time Muslims were given permission to fight and why it was granted, and the first five military expeditions of the Muslims.
      - video_id: zg1x0xfwiK8
        title: "[34] Marriage of Ali and Fatima"
        url: https://www.youtube.com/watch?v=zg1x0xfwiK8
        description: |-
          Imam Ali and Lady Fatima got married in the 2nd year AH. This lecture covers:
          - Lady Fatima's age at marriage (Shia vs Sunni views)
          - The people who unsuccessfully proposed to Fatima (and their reactions to the rejection)
          - Imam Ali's bridal gift for Lady Fatima
          - Their valima (the wedding feast)
      - video_id: 2-iBIU2c3Ms
        title: "[35] Prelude to the Battle of Badr"
        url: https://www.youtube.com/watch?v=2-iBIU2c3Ms
        description: The Meccans wanted to bolster their military situation, not okay with the Prophet Muhammad simply relocating to Medina. The Meccans had invested heavily in a caravan led by Abu Sufyan which would let them build up their military.
      - video_id: KPprgQ2qGjg
        title: "[36] Preparing for the Battle of Badr"
        url: https://www.youtube.com/watch?v=KPprgQ2qGjg
        description: The Quraysh set out with a huge army, intending to intimidate not just the Muslims but the rest of the Arabs as well.
      - video_id: 7HBOwrzwf-k
        title: "[37] Battle of Badr: Opening Moves"
        url: https://www.youtube.com/watch?v=7HBOwrzwf-k
        description: |-
          The Battle of Badr begins:
          - Prophet Muhammad tried to avoid hostilities, and some of the Quraysh wanted to avoid fighting as well. But Abu Jahl instigated the conflict forwards.
          - Fighting began with three one on one skirmishes
          - The miracle of the prophet throwing pebbles towards the Quraysh and blinding them
      - video_id: UQaGD67IMDY
        title: "[38] Battle of Badr: Victory"
        url: https://www.youtube.com/watch?v=UQaGD67IMDY
        description: |-
          Warfare during Battle of Badr and the Muslim's victory:
          - The story of Umayr ibn Al-Humam, who longed for a martyrdom
          - The two youth who killed Abu Jahl, and how they attacked him
          - Abu Jahl's arrogance even with his dying breaths
          - Umayyah ibn Khalaf's attempt to seek refuge once defeat was imminent
          - Lessons taught after the battle
      - video_id: WKnJFE1IBM4
        title: "[39] Prisoners of War"
        url: https://www.youtube.com/watch?v=WKnJFE1IBM4
        description: |-
          The immediate aftermath of the Battle of Badr, including:
          - How the prisoners of war were treated after the battle
          - Revelation of Surat al-Anfal, which included verses on warfare
          - How the spoils were divided
      - video_id: "-X3EWPhweE8"
        title: "[40] Changing the Qiblah"
        url: https://www.youtube.com/watch?v=-X3EWPhweE8
        description: |-
          How and why the qiblah was changed from Jersalem to the Kaaba:
          - The Jewish tribes had been mocking Muslims for worshipping towards Jerusalem
          - Quranic verses in Surah Baqarah explain why the Qiblah was changed
          - Quran's criticism of the people who had enmity in their hearts against Muslims.
      - video_id: 7uJvnpFZu0s
        title: "[41] Expulsion of Banu Qaynuqa'"
        url: https://www.youtube.com/watch?v=7uJvnpFZu0s
        description: While most Muslima and Jewish tribes in Medina were agriculture based, the Jewish tribe of Banu Qaynuqa consisted mainly of craftsmen and blacksmiths, making them highly militarized.  The tax-free marketplace, along with the Muslim's conflict with the Meccans (one of Banu Qaynuqa's main customer base) threatened Banu Qaynuqa's financial interests.
      - video_id: oNR6pPMAOrk
        title: "[42] Precursors to Uhud'"
        url: https://www.youtube.com/watch?v=oNR6pPMAOrk
        description: |-
          The events that occurred after the Battle of Badr, which led to the Battle of Uhud:
          - The Expedition of Qarqarat Al-Kudr, where nomadic tribes started hostilities against the Muslims
          - The Expedition of Sawiq, where Abu Sufyan led an assault against Medina
          - The Qaradah Raid, where the Muslims raided a Meccan caravan
          - The death of Uthman ibn Madh'un, one of the highest companions
          - The death of Ruqayyah
          - The assassination of Ka'b ibn Ashraf, a member of the Jewish tribe of Banu Nadhir, for treason (inciting Meccans to war against the Muslims)
      - video_id: Tl87UnuBTw4
        title: "[43] Preparing for the Battle of Uhud'"
        url: https://www.youtube.com/watch?v=Tl87UnuBTw4
        description: |-
          Both sides prepare for the Battle of Uhud soon after Imam Hasan's birth:
          - The battle was instigated by the Meccan's desire for revenge, the insult they felt from Islam, and the economic strain they had landed under
          - Abu Sufyan's attempts at raising an army
          - Hind's support of the army
          - Prophet Muhammad's investigation when an undercover Muslim informs him of Abu Sufyan's army
          - How Prophet Muhammad held his war council and respected his follower's wishes
      - video_id: 2mZw4Q4mQqk
        title: "[44] The Battle of Uhud'"
        url: https://www.youtube.com/watch?v=2mZw4Q4mQqk
        description: |-
          - The Muslims marched towards the invaders with an army of 1000 men. 
          - Munafiqs revealed: Abdullah ibn Ubayy deserted the army and left with 300 of the men, the munafiqs.
          - Battle tactics used by Prophet Muhammad
          - Fortications abandoned: The prophet gave the archerers unambiguous instructions to maintain a defensive position, yet they were ignored to try and obtain some spoils of war, giving the enemy a critical advantage
      - video_id: lQXTzbW0QaM
        title: "[45] Uhud: The First Skirmish'"
        url: https://www.youtube.com/watch?v=lQXTzbW0QaM
        description: With archers defending their backs, Ali ibn Abi Talib starts the skirmish with one on one battles, defeating nine opponents in a row.
      - video_id: 02wW7yvrbbs
        title: "[46] Uhud: Victory to Defeat"
        url: https://www.youtube.com/watch?v=02wW7yvrbbs
        description: As the Quraysh fled, the archers watching the army's back rushed to gather the spoils of war.
      - video_id: dDjeZ57V3VM
        title: "[47] Uhud: The Aftermath"
        url: https://www.youtube.com/watch?v=dDjeZ57V3VM
        description: |-
          After the Battle of Uhud:
          - Quraysh mutilate the bodies of Muslims
          - Prophet Muhammad sends a reconnissance mission to see if the Quraysh will invade Medina or return to Mecca
          - Various verses of the Quran are revealed to console the Muslims and instruct them on how to recover from the losses
          - The Meccans decide to come back to finish off the Muslims, but their army is scared away
          - Nomadic tribes, emboldened by the Muslim's defeat at Uhud, try to raid the Muslims
      - video_id: 1NrT1ojUbJE
        title: "[48] Banishment of Banu Nadhir"
        url: https://www.youtube.com/watch?v=1NrT1ojUbJE
        description: |-
          Prophet Muhammad approached the Jewish tribe of Banu Nadhir to help the Muslims make peace between themselves and another Jewish tribe, only to discover at the last minute that Banu Nadhir was planning to assassinate him.
          Why? The Banu Nadir couldn't accept a gentile as the final messenger of God. They considered it degrading to be subservient to a non-Jew.
          Faced with this treachery, Prophet Muhammad commanded them to take their belongings and leave Medina in ten days.
          The Banu Nadhir initially refuse, preparing for war, but surrender once the Muslims besieged their fortress.  Despite their willingness to fight the Prophet still allowed the tribe to depart, but orders them to leave their weapons behind this time. Banu Nadhir reloate to the Fortress of Khaybar
          Surah Al Hashr (#59) verses 1-16 describe this encounter.
      - video_id: FPm9rojYaHQ
        title: "[49] Prohibiting Alcohol"
        url: https://www.youtube.com/watch?v=FPm9rojYaHQ
        description: |-
          This lecture covers:
          - The gradual prohibition of Alcohol
          - Passing of Fatima bint Asad (Imam Ali ibn Abu Talib's mother)
          - Birth of Imam Husayn
          - Prophet Muhammad's Marriage to Umm Salamah
      - video_id: jK6rRnJFLQQ
        title: "[50] The Prophet's Wives"
        url: https://www.youtube.com/watch?v=jK6rRnJFLQQ
        description: At the end of the battle of Badr, Abu Sufyan had challenged the Muslims to a rematch a year later. This rematch was known as the Second Battle of Badr, and after seeing how much stronger the Muslims had gotten the Meccans were demoralized and decided to march back to Mecca. And so no battle never actually took place.
      - video_id: WtYqU661YSs
        title: "[51] Aisha bint Abu Bakr"
        url: https://www.youtube.com/watch?v=WtYqU661YSs
        description: Comparing the Shia and Sunni views on Aisha, the daughter of Abu Bakr and third wife of Prophet Muhammad. Sheikh Azhar also explains why the two sects may have such divergent views of her.
      - video_id: nQLj16n0-p4
        title: "[52] Hadiths on Aisha"
        url: https://www.youtube.com/watch?v=nQLj16n0-p4
        description: Continuing the comparison of Shia and Sunni views on Aisha bint Abu Bakr, Sheikh Azhar compares Shia and Sunni perspectives on hadiths that cause each sect to have their varying opinions on Aisha.
      - video_id: oUEGYtgQxOs
        title: "[53] Who are the Ahlul Bayt?"
        url: https://www.youtube.com/watch?v=oUEGYtgQxOs
        description: Who does the Quran refer to when it says Ahlul Bayt? Sheikh Azhar Nasser compares Sunni and Shia viewpoints based on hadit from Sunni sources.
      - video_id: m3cSoTy0ZlU
        title: "[54] Identifying the Ahlul Bayt"
        url: https://www.youtube.com/watch?v=m3cSoTy0ZlU
        description: Continuing the identification of who is meant by the holy Ahl al-Bayt, Sheikh Azhar Nasser uses hadiths from Sunni sources that are accepted by both Shias and Sunnis to compare Shia and Sunni viewpoints.
      - video_id: M4J8QU_piqg
        title: "[55] Sunni Views on The Verse of Purification"
        url: https://www.youtube.com/watch?v=M4J8QU_piqg
        description: Sheikh Azhar Nasser explores Sunni counter arguments to the Shia claim that the Verse of Purification (Quran 33:33)
      - video_id: H9nlv_zeIk4
        title: "[56] Arguments against the Shia View"
        url: https://www.youtube.com/watch?v=H9nlv_zeIk4
        description: Sheikh Azhar Nasser explores additional Sunni counter arguments to the Shia claim that the Verse of Purification (Quran 33:33)
      - video_id: yAlQEbGoO8U
        title: "[57] Battle of Khandaq: Allied Enemy Forces - Pt 1"
        url: https://www.youtube.com/watch?v=yAlQEbGoO8U
        description: |-
          All the Muslim's enemies band together in a final attempt to defeat them.
          In the year 5 AH, the two banished Jewish tribes ally with the Meccans to  mobilizing the masses for the ultimate battle against the Muslims, in what  would later be known as the Battle of the Azhab, aka Battle of Khandaq.
          The Quraysh had been humbled by their constant failure to wipe out the Muslims, and now that Muslims were blocking their trade routs the Quraysh were feeling the pain  in their wallets. Abu Sufyan, receptive to the invitation by the Jewish tribes,  rallies the Meccans and other Pagan tribes to raise the largest army the Arab  peninsula had ever seen so far and they begin marching against Medina.
          The Muslims in Mecca learn of this, and with Salman Al-Farsi's advice, begin digging a tranch along the city's border.
          The banished Jews reach out to the one Jewish tribe still remaining in Mecca and  convince them to also break their truce with the Muslims (now that a huge army  is coming towards the city). The tribe openly reveals that they'll break their covenant, and the Muslims realize they have to guard against enemies both  outside and inside Medina.
      - video_id: pINIJqCUd_8
        title: "[58] Khandaq: Digging the Trench - Pt 2"
        url: https://www.youtube.com/watch?v=pINIJqCUd_8
        description: |-
          Prophet Muhammad led by example, digging the trench harder than anyone else. When Fatima cooked some bread and brought it to him, she learned that it was the first thing the prophet had eaten in three days.
          During the digging, Imam Ali also dug relentlessly and the Prophet praised him saying "May my father be ransomed for the one who digs", highlights Imam Ali's high position in his the eyes. Prophet Muhammad never said this about any other companion.
          When some companions uncovered a large rock that no one could move, Prophet Muhammad hit it with three miraculous strikes, shattering it.
          At the end, Jabir ibn Abdullah al Ansari invited Prophet Muhammad to dinner. The prophet extended the invitation to the rest of the exhausted companions. Jabir worried the food would run short, but when the Prophet  arrived at Jabir's home he blessed the food and there ended up being enough to feed every guest.
      - video_id: VmsL_Ex8pxg
        title: "[59] Khandaq: Under Seige - Pt 3"
        url: https://www.youtube.com/watch?v=VmsL_Ex8pxg
        description: |-
          The Qurayshi army arrive in Medina and are stumped by the trench, and persuade the  Jewish tribe of Banu Quraydha in Medina and convince them to betray their oath of neutrality
          The Muslims stand vigilant day and night to defend the trench, even missing their obligatory prayers.
          Surah 33, Al Ahzaab captures the tension, covering the hypocrites who exposed themselves when they saw the pagan army, and the believers who saw the army as confirmation of what Prophet Muhammad had said to them.
          Amr ibn al-Wadd, a feared warrior, crosses over the trench and calls for one on one combat.  Imam Ali ibn Talib is the only one who's willing to answer and defeats him in combat.
          Lessons: - Do not broadcast and sensationalize evil, even if it is true, unless there's a benefit in making it public - Trust Allah and know that there is something positive in every difficulty and hardship
      - video_id: IL9k-WuTfFE
        title: "[60] Khandaq: Enemies Demoralized - Pt 4"
        url: https://www.youtube.com/watch?v=IL9k-WuTfFE
        description: |-
          Multiple factors came together to demoralize the Qurayshi coalition and got them to retreat, ending the battle:
          - Imam Ali's victory over Amr ibn al-Wadd - Shortage of food and fodder. They had prepared for quick battle, not a month-long seige - A violent storm that trashed the Qurayshi camp - Distrust sown between the kuffar and the jews by a secret convert - Some Arabs deciding they'd rather be ruled by Arab than by Jews, even of those Arabs are Muslims
      - video_id: 1z8FvpXBhtw
        title: "[61] Khandaq: Seige of Bani Qurayzah - Pt 5"
        url: https://www.youtube.com/watch?v=1z8FvpXBhtw
        description: |-
          After the enemy coalition gave up and retreated from Medina, the Muslims had to deal with the Banu Qurayzah's treachery during the seige. 
          This lecture covers:
          - Events during the three weeks the Muslims beseiged Bani Qurayzah
          - Options Bani Qurayzah considered in response
          - Their attemps to find allies to support them during their surrender, who would be lenient despite their deadly betrayal
      - video_id: NBeT7uNIv_s
        title: "[62] Khandaq: Bani Qurayzah's Punishment - Pt 6"
        url: https://www.youtube.com/watch?v=NBeT7uNIv_s
        description: |-
          After Bani Qurayzah surrendered, the punishment for their betrayal had to be decided.
          This lecture covers:
          - The penalty set by Bani Qurayzah's pre-Islamic ally, Sa'd ibn Mu'adh, and Prophet Muhammad's reaction to it
          - Why the punishment was so harsh
          - How even Bani Qurayzah's tribal custom at the time was to treat treachery with a similar punishment
          - Rebutting claims that the punishment was driven by anti-semitism
      - video_id: "-xWV9lPelWs"
        title: "[63] Sa'd's Burial & Marrying Zaynab bint Jahash"
        url: https://www.youtube.com/watch?v=-xWV9lPelWs
        description: |-
          Sa'd was a very high ranking companion and a shaheed.  Prophet Muhammad took much more care during his burial than he normally would,  yet he still chided someone who said that he would go straight to heaven.
          Lesson: If you have bad akhlaq, even the prophet cannot help you against the consequences 
          Later, Prophet Muhammad proposed Zaynab bint Jahash marry his adopted son  and ex-slave Zayd ibn Haritha. When the couple was unable to get along and got a divorce, the Prophet married Zaynab instead. 
          This broke multiple societal taboos: 
          1) Making marriage between the upper class and lower class seem acceptable and
          2) Showing that the rules between father/son relations do not apply to adopted sons.
      - video_id: pOFFolfr8a8
        title: "[64] Surah Munafiqun Revealed - Bani Mustaliq"
        url: https://www.youtube.com/watch?v=pOFFolfr8a8
        description: The tribe of Bani Mustaliq were planning to launch a surprise  attack against the Muslims, and rumor of it reached Prophet Muhammad. He sent a companion named Buraydah ibn al-Husayb to investigate. The rumor was confirmed.
      - video_id: JXkknql5HqY
        title: "[65] Treaty of Hudaybiyyah"
        url: https://www.youtube.com/watch?v=JXkknql5HqY
        description: |-
          Prophet Muhammad saw a dream of the Muslims entering the Ka'bah to worship, and he  instructs his followers to begin preparations to go to Mecca. They would go in  peace, without arms.
          The call to go for this pilgrimage turns into an opportunity to expose more of the Munafiqeen as they make excuses to avoid the seemingly dangerous journey.
          When the Quraysh get word of the Muslims arriving, they panic, fearing that allowing their enemies into the city would make the Meccans appear weak. While they  negotiate with the Muslims, the friendly local tribe of Khuza'ah helps the Muslims settle in Hudaybiyyah and even advocates for them to teh Quraysh, reminding them of their oath to allow all pilgrims to the holy Kaba
      - video_id: BaDUZ8PRumQ
        title: "[66] Hudaybiyya: The Prophet's Emissaries"
        url: https://www.youtube.com/watch?v=BaDUZ8PRumQ
        description: |-
          While camped outside Mecca at Hudaybiyya, the Prophet Muhammad sends an emissary into the  city. The Quraysh kill his camel, and he's barely allowed to leave.
          The Prophet then tries to send Umar ibn Al-Khattab, but he refuses out of fear.  Uthman, who had strong tribal ties with people in the city, is sent instead. However, he's  prevented from leaving for three days, and Muslims fear the worst
          Given the shakiness of the Muslims, the Prophet is inspired to renew their pledge to him in The Pledge of Ridhwan, and many verse of the Quran are revealed in praise of those who would stick with that pledge
      - video_id: rqh2rS-Y4cQ
        title: "[67] Hudaybiyya: Brink of Mutiny"
        url: https://www.youtube.com/watch?v=rqh2rS-Y4cQ
        description: |-
          The Quraysh sent Suhayl ibn Amr to negotiate the Treaty of Hudaybiyya with Prophet Muhammad. Suhayl had a vested interest in the outcome since two of his sons had converted to Islam, one of whom he was keeping captive.
          The Muslim masses were surprised by the treaty though, which they saw as an insult. Umar ibn Al-Khattab was particularly outraged, later saying that on that day he "doubted the Prophet's prophethood like [he] had never doubted it before"
          While on the surface the treaty looked like a setback, it set the stage for the Muslims' eventual victory over Quraysh.
      - video_id: ysbzCY4_cdc
        title: "[68] The Secret Benefits of Hudaybiyya"
        url: https://www.youtube.com/watch?v=ysbzCY4_cdc
        description: |-
          The many of the Muslims had seen the Treaty of Hudaybiyya as a humiliating  loss, yet Prophet Muhammad knew the treaty paved the way for their ultimate success.
          This lecture discusses the various ways this treaty helped the Muslims, along with  how Allah sent Surah Al-Fath right afterwards to bolden the Muslims and help them understand the victory which had just been won.
      - video_id: FqptIDOW2fU
        title: "[69] Dawah to Surrounding Leaders"
        url: https://www.youtube.com/watch?v=FqptIDOW2fU
        description: "With the repreieve provided by the Treaty of Hudaybiyya, Prophet Muhammad can focus on spreading Islam by doing dawah to surrounding leaders. This lecture covers encounters with two prominent leaders:"
      - video_id: hDuHQa1oDOs
        title: "[70] Letters to the Persians and Coptics"
        url: https://www.youtube.com/watch?v=hDuHQa1oDOs
        description: |-
          Prophet Muhammad continues his outreach to foreign leaders, sending messengrs to the Persian emperor Khosrow II and the Coptic ruler Muqawqis of Alexandria.
          The outreach teaches us:
          - Islam was always meant to be globalized, not just for the Arabs. We need to also think deeply about how to universalize the messaging
          - The way people respond to the Prophet had an impact on their dunya and akhira
          - The prophet addresses world leaders with their respective titles. This is part of the etiquette of dialogue.
          - Even when people are tyranical rulers, it doesn't give us the right to be abusive (especially when we're unprovoked). Even Musa was instructed to speak gently to Feron
          - Communicate using simple language and get to the point. The letters were short and succinct.
          - Customize your communication to cater to your audience
      - video_id: gBqMqgP0ERk
        title: "[71] Battle of Khaybar - Attempting Diplomacy"
        url: https://www.youtube.com/watch?v=gBqMqgP0ERk
        description: |-
          The fort of Khaybar was manned by Jewish tribes that had previously reacted treasonously against the Muslims and had been exiled from Medina in turn.
          They had already attacked the Muslims once, by participating in the Battle of Khandak, and Prophet Muhammad received intel that those Jewish tribes were again planning to ally with another pagan tribes to attack Medina.
          The Prophet again attempted a diplomatic outreach to the tribes in Khaybar, but it fell on deaf ears. Realizing that the Jews at Khaybar were determined to march against Mecca yet again, Prophet Muhammad prepared to strike against them first.
      - video_id: vkLiVO6T2Vc
        title: "[72] Khayber - Miracles and Conquest"
        url: https://www.youtube.com/watch?v=vkLiVO6T2Vc
        description: The Muslims marched to the Fort of Khaybar, attack and defeat it's treacherous occupants.
      - video_id: ddKpkuawxHs
        title: "[73] Khaybar - Victory, Khums & Marrying Safiyyah"
        url: https://www.youtube.com/watch?v=ddKpkuawxHs
        description: The victory at Khaybar changed the lives of the Muslim community and became a source of financial strength for them.
      - video_id: dUXztsqZ25w
        title: "[74] Fadak - Granted and Usurped"
        url: https://www.youtube.com/watch?v=dUXztsqZ25w
        description: Prophet Muhammad had given the garden of Fadak to his daughter Fatima, but after his passing it snatched away from her by Abu Bakr and Umar.
      - video_id: AdRc7uHHodo
        title: "[75] Umra al-Qadha"
        url: https://www.youtube.com/watch?v=AdRc7uHHodo
        description: Prophet Muhammad led the Muslims on a second attempt at Umra, thet qazaa for the last one which they couldn't complete.
      - video_id: foTI7fQ3ks8
        title: "[76] The Battle of Mu'tah - Prelude"
        url: https://www.youtube.com/watch?v=foTI7fQ3ks8
        description: The Battle of Mu'tah was triggered when a messenger Prophet Muhammad sent to Ghassani Shurahbil was murdered. This was a declaration of war.
      - video_id: uU0X1QqHad0
        title: "[77] Fighting the Roman Army"
        url: https://www.youtube.com/watch?v=uU0X1QqHad0
        description: The Roman army, with 10,000 soliders, outnumbered the Muslims 3:1 at the Battle of Mutah. Some of the Muslims feared the large army and wanted to retreat, but the senior companions bolstered their courage.
      - video_id: EMvH--xJPjg
        title: "[78] Campaign of Dhat Al-Salasil"
        url: https://www.youtube.com/watch?v=EMvH--xJPjg
        description: The Campaign of Dhat Al-Salasil occurred soon after "defeat" at the Battle of Mu'tah, when various Ghassanid affiliated tribes sensed an opportunity to invade Medina. They thought the Muslims would be weak and demoralized.
      - video_id: H2eC8R4WoTQ
        title: "[79] Conquest of Mecca [1] - The Broken Treaty"
        url: https://www.youtube.com/watch?v=H2eC8R4WoTQ
        description: The Treaty of Hudaybiyya had included a vow of there being no fighting between the Quraysh and the Muslims. However, when the tribe of Banu Bakr asked the leaders of Quraysh for help in a raid against their long time foe Banu Khuza'ah, a tribe with many Muslims and who were longtime allies of Prophet Muhammad, the Quraysh joined in.
      - video_id: CBYrR05Xgug
        title: "[80] Conquest of Mecca [2] - Tactics and Betrayal"
        url: https://www.youtube.com/watch?v=CBYrR05Xgug
        description: Prophet Muhammad kept the attack on Mecca a closely guarded secret. However Hatib ibn Abi Balta'ah sent a letter to the Quraysh warning them of the attack. The Prophet was informed of this by revelation and he sent Ali and Zubayr to retrieve it.
      - video_id: oUkFpvzwUA4
        title: "[81] Conquest of Mecca [3] - Mecca Surrenders"
        url: https://www.youtube.com/watch?v=oUkFpvzwUA4
        description: Prophet Muhammad had promised safety to any Meccan who either remined in their own home during the invasion or went to Abu Sufyan's home.
      - video_id: A_2pklaBlHA
        title: "[82] Conquest of Mecca [4] - Amnesty Granted"
        url: https://www.youtube.com/watch?v=A_2pklaBlHA
        description: Prophet Muhammad destroys all the idols in the Kaaba with Imam Ali's help and washes the images that had been drawn inside.
      - video_id: 7QDkg3-SzFg
        title: "[83] Converting in Droves"
        url: https://www.youtube.com/watch?v=7QDkg3-SzFg
        description: After the conquest of Mecca, hundreds of thousands of Arabs came to the prophet to convert and pledge their allegiance. This lecture covers why they joined now and reflects the verses of Surah An-Nasr which predicted this.
      - video_id: GpYmvk1JQSI
        title: "[84] The Battle of Hunain"
        url: https://www.youtube.com/watch?v=GpYmvk1JQSI
        description: Banu Thaqif had been long standing rivals of the Quraysh. They saw the Quraysh's defeated as an opportunity to attack and seize control of Mecca for themselves.
      - video_id: bsgyDegHRDY
        title: "[85] The Siege of Ta'if"
        url: https://www.youtube.com/watch?v=bsgyDegHRDY
        description: After victory against Banu Thaqif at Hunayn, Prophet Muhammad marched his army to Ta'if, where Banu Thaqif had retreated to and barricated themselves inside with enough food and water to last them for a year.
      - video_id: S9Ehi7GsQf0
        title: "[86] Tabuk Part 1 - Rome Conquers Persia"
        url: https://www.youtube.com/watch?v=S9Ehi7GsQf0
        description: "This lecture covers the prelude to the Battle of Tabuk. Key topics include:"
      - video_id: P4wgpyhlgVQ
        title: "[87] Imam Ali - As Harun was to Musa | Tabuk Pt 2"
        url: https://www.youtube.com/watch?v=P4wgpyhlgVQ
        description: When leaving for Tabuk, the Prophet (s) appointed Imam Ali (as) as his deputy in Madinah to protect against any uprising led by the Munafiqeen. That day he said to Imam Ali "You are to me as Harun was to Musa, except that there is no prophet after me."
      - video_id: ll8DOnchjAI
        title: "[88] Assassination plot at the Mountain Pass"
        url: https://www.youtube.com/watch?v=ll8DOnchjAI
        description: Allah had warned Prophet Muhammad in the Quran (64:4) that his companions contained hypocrites so skilled at deceit that the prophet himself was pleased by their speech and appearance. Only revelation could expose them.
      - video_id: "-xm74nyYNAo"
        title: "[89] Masjid ad Zarar destroyed"
        url: https://www.youtube.com/watch?v=-xm74nyYNAo
        description: Masjid ad Zarar, the Mosque of Harm, was a mosque built by the hypocrites of Madinah to coverty oppose the Prophet Muhammad (pbuh). They completed it just before Prophet Muhammad departed on the Expedition of Tabuk.
      - video_id: R-q9VNc-wo0
        title: "[90] Year of Delegations"
        url: https://www.youtube.com/watch?v=R-q9VNc-wo0
        description: The Expedition of Tabuk demonstrated to Arabs the strength of the Muslims. Over the next year, the various tribes responded by sending the Prophet Muhammad (pbuh) delegations to accept Islam and pledge their allegiance. Prophet Muhammmad welcomed them & forgave past conflicts.
      - video_id: Lj9d6jaAWv0
        title: "[91] Event of Mubahila"
        url: https://www.youtube.com/watch?v=Lj9d6jaAWv0
        description: Among the delegations that came to Prophet Muhammad was on e from the Christians of Najran after their chief chief bishop and his people were invited to Islam. They came to negotiate a truce with the Prophet.
      - video_id: r7WikQByyik
        title: "[92] Disavowing the Polythiests"
        url: https://www.youtube.com/watch?v=r7WikQByyik
        description: Prophet Muhammad wanted to eradicate polythiesm and all practices associated with it, such as doing tawaaf around the kaaba naked.
      - video_id: dLRpVzn2k1M
        title: "[93] Tax Collection Struggles"
        url: https://www.youtube.com/watch?v=dLRpVzn2k1M
        description: After the Conquest of Makkah, the prophet dispatched tax collectors to different Bedouin tribes, aiming to consolidate an Islamic state and establish a system of governance that would ensure stability, support the needed, and fund state activities.
      - video_id: ZfXL7MqjgOU
        title: "[94] Missions in Yemen"
        url: https://www.youtube.com/watch?v=ZfXL7MqjgOU
        description: Prophet Muhammad sent a mission to Yemen to invite them to Islam. The first mission was led by Khalid ibn Al-Walid, who was a harsh man who had fought against the Muslims in the Battle of Uhud, but he had an aristrocratic background and by making him feel valued Prophet Muhammad had hoped to turn him into a productive member of the Muslim community.
      - video_id: 7NoMKBn89Pc
        title: "[95] The Prophet's Only Hajj"
        url: https://www.youtube.com/watch?v=7NoMKBn89Pc
        description: "In the last months of the prophet's life, Gabriel descended to the prophet conveying a message from Allah: \"There remain two obligations that you must convey to your people: the obligation of Hajj, and the obligation of Wilayah (the guardianship and succession) after you. For indeed, I have never left My earth without a proof, and I will never leave it without one.\"  The Prophet had often spoken about Imam Ali's unique rank, but hadn't formalized his succession in front of a large audience."
      - video_id: UJKWYp0lr2g
        title: "[96] The Event of Ghadir Khumm"
        url: https://www.youtube.com/watch?v=UJKWYp0lr2g
        description: Prophet Muhammad was worried about people rebelling against him if he announced Imam Ali as his successor, so he delayed following the message to formalize his succesorship as long as he was allowed to.
      - video_id: S9hESB_xSZA
        title: "[97] The Aftermath of Ghadeer Khumm"
        url: https://www.youtube.com/watch?v=S9hESB_xSZA
        description: After Prophet Muhammad declared Ali ibn Abi Talib's successorship, the angel Gabriel descended with an extension of the verse Quran 5:3, adding "today I have perfected your religion for you, and I have completed my blessing upon you, and I have approved Islam as your religion", showing that there's a version of Islam that's perfected and a version that's incomplete.
      - video_id: gRZO0Ubd08o
        title: "[98] False Prophets"
        url: https://www.youtube.com/watch?v=gRZO0Ubd08o
        description: With the success of Islam, now multiple people started popping up and claiming to be Prophets.
      - video_id: CQhfMdDYZok
        title: "[99] Disobeying the Prophet"
        url: https://www.youtube.com/watch?v=CQhfMdDYZok
        description: The Prophet's death was impending, and he had commanded all his companions to join Usama ibn Zayd's army to go fight the Romans.  Usama was a young man, and many companions chaffed at being put under the leadership of something that age. The prophet, while sick, had to rebuke them to send them back to the army.
      - video_id: yBxvKOHjZcM
        title: "[100] Denied Pen and Paper, Calamity of Thursday"
        url: https://www.youtube.com/watch?v=yBxvKOHjZcM
        description: In these last few days, many of the companions explicitly disregarded the prophet's instructions in order to secure political power after his demise. The prophet had attempted to prevent their schemes by instructing many of the senior companions to leave Medina with Usama ibn Zayd, so that Imam Ali could assume leadership without interference, but many delayed and made excuses.
      - video_id: ojs3bdeq37o
        title: "[101] Prophet Offering Retribution"
        url: https://www.youtube.com/watch?v=ojs3bdeq37o
        description: In his last days, knowing death was imminent, Prophet Muhammad called his uncle Abbas and Imam Ali. He asked his uncle to carry out his will and settle his affairs after the prophet's death. When the uncle demured, the prophet asked Imam Ali, who accepted. The Prophet also gave Imam Ali his sword, battle gear, and ring.
      - video_id: U8kodjjLYwY
        title: "[102] Was Prophet Muhammad Poisoned?"
        url: https://www.youtube.com/watch?v=U8kodjjLYwY
        description: Everyone knows the prophet died of illness, and many say it was due to poison. Some say it was poison he consumed during te  Battle of Khaybar three years earlier, but there are some serious doubts about that theory.
      - video_id: 6_yA6nDAiCE
        title: "[103] Death of the Prophet"
        url: https://www.youtube.com/watch?v=6_yA6nDAiCE
        description: This lecture covers various events that occurred on the day of the prophet's passing and the day after, up until his burial.
