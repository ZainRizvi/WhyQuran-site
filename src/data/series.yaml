        url: https://www.youtube.com/watch?v=lqLK38jzgqI
        description: Verse 73-78 talk about the ways hypocrisy can manifest in a person's heart and the ways Allah instructed the Prophet  Muhammad to respond to the hypocrites in his midst who were undermining his efforts.
      - video_id: 3_kiF3ACyuo
