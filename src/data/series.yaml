        url: https://www.youtube.com/watch?v=m3cSoTy0ZlU
        description: Continuing the identification of who is meant by the holy Ahl al-Bayt, Sheikh Azhar Nasser uses hadiths from Sunni sources that are accepted by both Shias and Sunnis to compare Shia and Sunni viewpoints.
      - video_id: M4J8QU_piqg
        title: "[55] Sunni Views on The Verse of Purification"
